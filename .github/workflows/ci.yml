name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  schema-drift:
    name: Schema drift (migrations ↔ code)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: drift_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: drift_check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # psql client for applying migrations + introspection
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      # Applies all migrations (fails on NEW breakage, tolerates the documented
      # known-failing ones) then asserts every column the API references exists.
      - run: npm run db:check-drift

  verify:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test --workspace=apps/api --if-present
