name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  schema-drift:
    name: Schema drift (migrations ↔ code)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: drift_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: drift_check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # psql client for applying migrations + introspection
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      # Applies all migrations (fails on NEW breakage, tolerates the documented
      # known-failing ones) then asserts every column the API references exists.
      - run: npm run db:check-drift

  tenant-isolation:
    name: Tenant isolation ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Fails if any new .from('table') call on a tenant-scoped table lacks a
      # .eq('tenant_id', ...) guard.  Existing violations are tracked in
      # scripts/tenant-isolation-baseline.json; only additions break CI.
      # To fix: add the filter, update DOCUMENTED_EXCEPTIONS, or re-run
      # --save-baseline after genuinely reducing the count.
      - run: node scripts/check-tenant-isolation.mjs --ratchet

  error-hygiene:
    name: Error hygiene ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Prevents regression of Gate 4 (Phase B) api-errors.ts adoption.
      # Fails if raw reply.code(500).send() count increases in API routes —
      # new routes must use serverError() from lib/api-errors.ts instead.
      - run: node scripts/check-manual-500s.mjs
      # Fails if console.error() count increases in API routes/lib —
      # structured logging (req.log.error) must be used instead.
      - run: node scripts/check-console-error.mjs

  data-correctness:
    name: Data correctness ratchet (RC-G5-01)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # RC-G5-01: Prevents silent partial-dataset processing.
      # PostgREST enforces a server-side max-rows=1000 ceiling that silently
      # overrides any .limit() — even .limit(5000) returns 1,000 rows with HTTP 200.
      # Fails if any NEW query against a high-cardinality table (employees,
      # attendance_daily, payroll_records, etc.) omits fetchAllRows() or uses a
      # hard-coded .limit(N > 20) that risks truncation.
      # Existing violations are tracked in scripts/unbounded-queries-baseline.json.
      # To suppress an intentional exception: // lint-query-ok: <reason> before .from()
      # To lock in a fix: node scripts/check-unbounded-queries.mjs --save-baseline
      - run: node scripts/check-unbounded-queries.mjs --ratchet

  verify:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        # The @hrms/api project is large enough that tsc can exceed Node's default
        # ~2GB heap on CI runners (OOM, exit 134). Raise the limit for typecheck.
      - run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      # Lint gates merges too — the web lint also runs the design-token colour
      # check (scripts/check-raw-colors.mjs) and enforces --max-warnings 0.
      - run: npm run lint
      - run: npm run test --workspace=apps/api --if-present
