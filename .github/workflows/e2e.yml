name: E2E Tests — Full Lifecycle

on:
  workflow_dispatch:         # manual trigger from GitHub Actions UI
  schedule:
    - cron: '0 3 * * 1'    # every Monday 03:00 UTC (overnight, won't interrupt work)

jobs:
  e2e:
    name: End-to-End Lifecycle Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/e2e/package.json

      - name: Install Playwright
        working-directory: apps/e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: apps/e2e
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL || 'https://hrms-web-alpha.vercel.app' }}
          E2E_HR_EMAIL: ${{ secrets.E2E_HR_EMAIL }}
          E2E_HR_PASS:  ${{ secrets.E2E_HR_PASS }}
        run: npx playwright test

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 30

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-screenshots
          path: apps/e2e/test-results/
          retention-days: 30

      - name: Upload JSON results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-json
          path: apps/e2e/test-results/results.json
          retention-days: 30
