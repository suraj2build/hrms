      <text x="18" y="100" font-size="10.5" fill="#36433C">Employees</text>
      <text x="18" y="126" font-size="10.5" fill="#36433C">Payroll</text>
      <text x="18" y="152" font-size="10.5" fill="#36433C">Reports</text>
