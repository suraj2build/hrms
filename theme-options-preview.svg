<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1180" viewBox="0 0 1320 1180" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- ───── Gradients per theme ───── -->
    <!-- 1. Darkest Maroon -->
    <linearGradient id="g-maroon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E1F2C"/><stop offset="0.5" stop-color="#4E1620"/><stop offset="1" stop-color="#330D14"/>
    </linearGradient>
    <!-- 2. Gunmetal + Dark Green -->
    <linearGradient id="g-gunmetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E3A40"/><stop offset="0.5" stop-color="#222B30"/><stop offset="1" stop-color="#151B1E"/>
    </linearGradient>
    <!-- 3. Charcoal Grey -->
    <linearGradient id="g-charcoal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A3D42"/><stop offset="0.5" stop-color="#2B2E32"/><stop offset="1" stop-color="#1B1D20"/>
    </linearGradient>
    <!-- 4. Darkest Green -->
    <linearGradient id="g-forest" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F4D3A"/><stop offset="0.5" stop-color="#143A2B"/><stop offset="1" stop-color="#0C261C"/>
    </linearGradient>
    <!-- 5. Bottle Green + Gold -->
    <linearGradient id="g-bottle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13503F"/><stop offset="0.5" stop-color="#0E3D30"/><stop offset="1" stop-color="#08261E"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#1a1a1a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Canvas -->
  <rect width="1320" height="1180" fill="#F4F5F7"/>

  <!-- Title -->
  <text x="40" y="48" font-size="24" font-weight="700" fill="#1B1D20">Theme Options · Dark &amp; Sophisticated</text>
  <text x="40" y="72" font-size="13" fill="#6B7177">Each card is a mini app preview. Pick a number and I'll wire it up as a toggle-able theme (your blue brand stays untouched).</text>

  <!-- ════════════ CARD TEMPLATE: 5 cards in a 2-col + 1 grid ════════════ -->
  <!-- We lay out: row1 = card1, card2 ; row2 = card3, card4 ; row3 = card5 (full info) -->

  <!-- ───────────── CARD 1: Darkest Maroon ───────────── -->
  <g transform="translate(40,100)">
    <rect width="600" height="300" rx="16" fill="#FFFFFF" filter="url(#shadow)"/>
    <!-- header label -->
    <text x="24" y="34" font-size="15" font-weight="700" fill="#1B1D20">1 · Darkest Maroon</text>
    <text x="24" y="54" font-size="11.5" fill="#8A9099">Oxblood · accent champagne #C8A05A</text>
    <!-- mini app -->
    <g transform="translate(24,70)">
      <!-- topbar -->
      <rect width="552" height="34" rx="8" fill="#FBFAFA" stroke="#EFE7E8"/>
      <rect x="10" y="9" width="16" height="16" rx="5" fill="url(#g-maroon)"/>
      <text x="36" y="22" font-size="11.5" font-weight="700" fill="#241619">Cognix<tspan fill="#B98A3C">HR</tspan></text>
      <!-- sidebar -->
      <rect x="0" y="44" width="120" height="170" rx="8" fill="#FBFAFA" stroke="#EFE7E8"/>
      <rect x="8" y="54" width="104" height="26" rx="6" fill="#F4E4E0"/>
      <rect x="8" y="54" width="3" height="26" rx="2" fill="#6E1F2C"/>
      <text x="18" y="71" font-size="10.5" font-weight="650" fill="#6E1F2C">Dashboard</text>
      <text x="18" y="100" font-size="10.5" fill="#4A3D3F">Employees</text>
      <text x="18" y="126" font-size="10.5" fill="#4A3D3F">Payroll</text>
      <text x="18" y="152" font-size="10.5" fill="#4A3D3F">Reports</text>
      <!-- hero -->
      <rect x="132" y="44" width="200" height="80" rx="11" fill="url(#g-maroon)"/>
      <rect x="132" y="44" width="200" height="40" rx="11" fill="url(#sheen)"/>
      <text x="148" y="70" font-size="10" fill="#F0D6CF">Total CTC</text>
      <text x="148" y="98" font-size="22" font-weight="700" fill="#fff">₹2.46 Cr</text>
      <text x="148" y="115" font-size="9.5" fill="#E2B8AF">▲ 8.2%</text>
      <!-- white kpi -->
      <rect x="344" y="44" width="208" height="80" rx="11" fill="#FFFFFF" stroke="#EEE9EA"/>
      <text x="360" y="70" font-size="10" fill="#8A9099">Headcount</text>
      <text x="360" y="98" font-size="22" font-weight="700" fill="#241619">1,284</text>
      <text x="360" y="115" font-size="9.5" fill="#2E7D52">▲ 24 joiners</text>
      <!-- button + badges -->
      <rect x="132" y="136" width="104" height="30" rx="8" fill="#7B2233"/>
      <text x="184" y="156" font-size="11" font-weight="650" fill="#fff" text-anchor="middle">Run Payroll</text>
      <rect x="246" y="138" width="86" height="26" rx="8" fill="#FFFFFF" stroke="#C8A05A" stroke-width="1.3"/>
      <text x="289" y="156" font-size="11" font-weight="600" fill="#9A6F2A" text-anchor="middle">Export</text>
      <rect x="344" y="139" width="60" height="24" rx="12" fill="#E7F2EB"/><text x="374" y="155" font-size="10" fill="#2E7D52" text-anchor="middle">Active</text>
      <rect x="412" y="139" width="68" height="24" rx="12" fill="#FBE3E4"/><text x="446" y="155" font-size="10" fill="#C42B32" text-anchor="middle">Overdue</text>
      <!-- swatches -->
      <rect x="132" y="178" width="46" height="22" rx="5" fill="#6E1F2C"/>
      <rect x="184" y="178" width="46" height="22" rx="5" fill="#8A2A3B"/>
      <rect x="236" y="178" width="46" height="22" rx="5" fill="#C8A05A"/>
      <text x="292" y="194" font-size="9.5" fill="#8A9099">#6E1F2C · #8A2A3B · gold</text>
    </g>
  </g>

