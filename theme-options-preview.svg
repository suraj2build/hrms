      <rect x="236" y="178" width="46" height="22" rx="5" fill="#2F9E6B"/>
      <text x="292" y="194" font-size="9.5" fill="#8A9099">#2E3A40 · #3C4C53 · emerald</text>
    </g>
  </g>

