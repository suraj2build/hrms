      <text x="148" y="115" font-size="9.5" fill="#9FB6CF">▲ 8.2%</text>
      <rect x="344" y="44" width="208" height="80" rx="11" fill="#FFFFFF" stroke="#EAEBEC"/>
      <text x="360" y="70" font-size="10" fill="#8A9099">Headcount</text>
