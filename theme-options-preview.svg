  <!-- ───────────── INFO PANEL (right of card 5) ───────────── -->
  <g transform="translate(680,740)">
    <rect width="600" height="300" rx="16" fill="#FFFFFF" filter="url(#shadow)"/>
    <text x="24" y="38" font-size="16" font-weight="700" fill="#1B1D20">How to choose</text>
    <text x="24" y="66" font-size="12.5" fill="#41454A">• These are <tspan font-weight="700">dark hero / light canvas</tspan> themes — the dark colour</text>
    <text x="36" y="84" font-size="12.5" fill="#41454A">lives on the sidebar accent, KPI hero, and primary buttons.</text>
    <text x="24" y="110" font-size="12.5" fill="#41454A">• The bulk of the screen stays a clean light canvas for</text>
    <text x="36" y="128" font-size="12.5" fill="#41454A">readability — long data tables, forms, payroll grids.</text>

    <text x="24" y="160" font-size="12.5" fill="#41454A"><tspan font-weight="700">Accent</tspan> = the second colour (gold / emerald / steel). It</text>
    <text x="36" y="178" font-size="12.5" fill="#41454A">replaces the current teal on links, focus rings, highlights.</text>

    <text x="24" y="210" font-size="12.5" fill="#41454A"><tspan font-weight="700">Status colours stay universal</tspan> — green=success,</text>
    <text x="36" y="228" font-size="12.5" fill="#41454A">amber=warning, red=error — so alerts never blend in.</text>

    <rect x="24" y="246" width="552" height="36" rx="9" fill="#F4F5F7"/>
    <text x="40" y="269" font-size="12.5" fill="#2B2E32">Reply with a number (1–5), or mix: e.g. "<tspan font-weight="700">4 but with steel accent</tspan>".</text>
