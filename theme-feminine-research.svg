    <text x="20" y="100" font-size="20" font-weight="700" fill="#241130">Plum Orchid</text>
    <text x="20" y="122" font-size="12" fill="#7C6A88">Deep plum · orchid accent</text>
    <text x="20" y="142" font-size="11.5" font-weight="600" fill="#5B2A6E">RECOMMENDED — most distinct &amp; luxe</text>

    <!-- swatches -->
