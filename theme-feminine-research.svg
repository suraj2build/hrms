    <rect x="170" y="158" width="140" height="64" rx="10" fill="url(#a-btn)"/><text x="182" y="196" font-size="12" font-weight="700" fill="#FFF">gradient</text><text x="182" y="213" font-size="10" fill="#D9C2E6">#6D3A82→#5B2A6E</text>
    <rect x="20" y="230" width="92" height="52" rx="10" fill="#C9A0DC"/><text x="30" y="261" font-size="12" font-weight="700" fill="#3A1B49">#C9A0DC</text><text x="30" y="275" font-size="9" fill="#4A2A5C">orchid accent</text>
