    <text x="48" y="352" font-size="11" fill="#7C6A88">Operational HR reporting</text>
    <rect x="34" y="360" width="100" height="18" rx="9" fill="#F0E6F6"/><text x="46" y="373" font-size="9.5" fill="#5B2A6E">PF · ESI · PT</text>
