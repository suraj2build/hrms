    <rect x="148" y="560" width="56" height="40" rx="9" fill="#C93535"/><text x="156" y="585" font-size="10" fill="#FFF">alert</text>
    <text x="20" y="628" font-size="11" fill="#9A8AA6">success / warning / alert stay shared (unchanged)</text>
    <text x="20" y="660" font-size="12" fill="#241130" font-weight="600">Vibe: regal, sophisticated, clearly premium</text>
  </g>

