    <linearGradient id="a-nav" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3F1A50"/><stop offset="1" stop-color="#6D3A82"/></linearGradient>
    <linearGradient id="b-btn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8E4A6E"/><stop offset="1" stop-color="#5E2A47"/></linearGradient>
    <linearGradient id="b-nav" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3F1A30"/><stop offset="1" stop-color="#8E4A6E"/></linearGradient>
    <linearGradient id="c-btn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C24A7A"/><stop offset="1" stop-color="#93264F"/></linearGradient>
    <linearGradient id="c-nav" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6E1539"/><stop offset="1" stop-color="#C24A7A"/></linearGradient>
