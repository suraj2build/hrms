  <rect width="1480" height="860" fill="#FAFAFB"/>
  <text x="40" y="50" font-size="28" font-weight="700" fill="#1A1A22">Feminine theme — research directions</text>
  <text x="40" y="80" font-size="15" fill="#6B6B78">Four premium, elegant options · each a deep brand anchor + a soft signature accent · light canvas + white sidebar (same architecture as Petrol / Bordeaux / Slate)</text>

  <!-- ============ OPTION A: PLUM ORCHID ============ -->
  <g transform="translate(40,110)">
