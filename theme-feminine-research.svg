    <rect x="20" y="456" width="90" height="28" rx="14" fill="#F0E6F6"/><text x="34" y="474" font-size="11" fill="#5B2A6E">Filter</text>
    <rect x="120" y="456" width="100" height="28" rx="14" fill="url(#a-btn)"/><text x="138" y="474" font-size="11" fill="#FFF">Active chip</text>
    <text x="20" y="516" font-size="12" fill="#7C6A88">Body copy in muted mauve-grey for secondary text.</text>
    <text x="20" y="540" font-size="12" font-weight="600" fill="#5B2A6E" text-decoration="underline">View all reports →</text>
