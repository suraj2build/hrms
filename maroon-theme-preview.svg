<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Metallic maroon gradient (oxblood) with sheen -->
    <linearGradient id="maroon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9A3140"/>
      <stop offset="0.45" stop-color="#7B2233"/>
      <stop offset="1" stop-color="#531521"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="champagne" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E2C485"/>
      <stop offset="1" stop-color="#C19A52"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A2A3B"/>
      <stop offset="1" stop-color="#651B28"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#3a1018" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Canvas (warm off-white, not cool slate) -->
  <rect width="1280" height="820" fill="#FAF6F4"/>

  <!-- ───────── Top bar ───────── -->
  <rect x="0" y="0" width="1280" height="58" fill="#FFFFFF"/>
  <rect x="0" y="57" width="1280" height="1" fill="#ECE2E0"/>
  <!-- Logo mark -->
  <rect x="20" y="14" width="30" height="30" rx="8" fill="url(#maroon)"/>
  <rect x="20" y="14" width="30" height="15" rx="8" fill="url(#sheen)"/>
  <text x="35" y="35" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">C</text>
  <text x="62" y="36" font-size="18" font-weight="700" fill="#241619">Cognix<tspan fill="#B98A3C">HR</tspan></text>
  <!-- top nav -->
  <text x="300" y="36" font-size="13" fill="#6E2533" font-weight="600">Operations</text>
  <text x="400" y="36" font-size="13" fill="#8A7B7D">Workforce</text>
  <text x="500" y="36" font-size="13" fill="#8A7B7D">Payroll</text>
  <text x="585" y="36" font-size="13" fill="#8A7B7D">Compliance</text>
  <!-- avatar -->
  <circle cx="1245" cy="29" r="15" fill="url(#maroon)"/>
  <text x="1245" y="34" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">SK</text>

  <!-- ───────── Sidebar ───────── -->
  <rect x="0" y="58" width="232" height="762" fill="#FFFFFF"/>
  <rect x="231" y="58" width="1" height="762" fill="#ECE2E0"/>
  <text x="24" y="96" font-size="11" font-weight="700" letter-spacing="1" fill="#A8989A">MAIN</text>
  <!-- active item -->
  <rect x="14" y="108" width="204" height="38" rx="9" fill="#F6E7E1"/>
  <rect x="14" y="108" width="3.5" height="38" rx="2" fill="#7B2233"/>
  <text x="34" y="132" font-size="13.5" font-weight="650" fill="#7B2233">Dashboard</text>
  <!-- items -->
  <text x="34" y="178" font-size="13.5" fill="#3D2E30">Employees</text>
  <text x="34" y="220" font-size="13.5" fill="#3D2E30">Attendance</text>
  <text x="34" y="262" font-size="13.5" fill="#3D2E30">Payroll</text>
  <!-- hover (champagne tint) -->
  <rect x="14" y="284" width="204" height="38" rx="9" fill="#F7EFDD"/>
  <text x="34" y="308" font-size="13.5" fill="#3D2E30">Reports</text>
  <text x="34" y="350" font-size="13.5" fill="#3D2E30">Compliance</text>
  <text x="24" y="404" font-size="11" font-weight="700" letter-spacing="1" fill="#A8989A">ADMIN</text>
  <text x="34" y="436" font-size="13.5" fill="#3D2E30">Masters</text>
  <text x="34" y="478" font-size="13.5" fill="#3D2E30">Settings</text>

  <!-- ───────── Main ───────── -->
  <text x="264" y="104" font-size="22" font-weight="700" fill="#241619">Workforce Overview</text>
  <text x="264" y="128" font-size="13" fill="#8A7B7D">Smarter Workforce. Stronger Future.</text>

  <!-- KPI hero (metallic maroon) -->
  <rect x="264" y="150" width="300" height="120" rx="16" fill="url(#maroon)" filter="url(#shadow)"/>
  <rect x="264" y="150" width="300" height="58" rx="16" fill="url(#sheen)"/>
  <text x="288" y="186" font-size="12" fill="#F3D9D0">Total Annual CTC</text>
  <text x="288" y="224" font-size="30" font-weight="700" fill="#FFFFFF">₹2.46 Cr</text>
  <text x="288" y="248" font-size="11.5" fill="#E9C9C0">▲ 8.2% vs last year</text>

  <!-- KPI white cards -->
  <g filter="url(#shadow)">
    <rect x="584" y="150" width="208" height="120" rx="16" fill="#FFFFFF"/>
    <rect x="812" y="150" width="208" height="120" rx="16" fill="#FFFFFF"/>
    <rect x="1040" y="150" width="216" height="120" rx="16" fill="#FFFFFF"/>
  </g>
  <text x="608" y="186" font-size="12" fill="#8A7B7D">Headcount</text>
  <text x="608" y="224" font-size="28" font-weight="700" fill="#241619">1,284</text>
  <text x="608" y="248" font-size="11.5" fill="#2E7D52">▲ 24 joiners</text>

  <text x="836" y="186" font-size="12" fill="#8A7B7D">Fill Rate</text>
  <text x="836" y="224" font-size="28" font-weight="700" fill="#7B2233">92%</text>
  <text x="836" y="248" font-size="11.5" fill="#8A7B7D">of sanctioned</text>

  <text x="1064" y="186" font-size="12" fill="#8A7B7D">Attrition</text>
  <text x="1064" y="224" font-size="28" font-weight="700" fill="#241619">6.4%</text>
  <text x="1064" y="248" font-size="11.5" fill="#C2890F">▲ watch</text>

  <!-- Buttons + badges row -->
  <g filter="url(#shadow)">
    <rect x="264" y="298" width="150" height="40" rx="10" fill="url(#btn)"/>
  </g>
  <rect x="264" y="298" width="150" height="20" rx="10" fill="url(#sheen)"/>
  <text x="339" y="323" font-size="13.5" font-weight="650" fill="#FFFFFF" text-anchor="middle">Run Payroll</text>

  <rect x="426" y="298" width="120" height="40" rx="10" fill="#FFFFFF" stroke="#C19A52" stroke-width="1.5"/>
  <text x="486" y="323" font-size="13.5" font-weight="600" fill="#9A6F2A" text-anchor="middle">Export</text>

  <rect x="560" y="298" width="110" height="40" rx="10" fill="#FFFFFF" stroke="#E3D7D5" stroke-width="1.5"/>
  <text x="615" y="323" font-size="13.5" font-weight="600" fill="#3D2E30" text-anchor="middle">Filters</text>

  <!-- badges -->
  <rect x="700" y="306" width="78" height="24" rx="12" fill="#E7F2EB"/>
  <text x="739" y="322" font-size="11.5" font-weight="600" fill="#2E7D52" text-anchor="middle">Active</text>
  <rect x="788" y="306" width="86" height="24" rx="12" fill="#FBF1DB"/>
  <text x="831" y="322" font-size="11.5" font-weight="600" fill="#A9740C" text-anchor="middle">Pending</text>
  <rect x="884" y="306" width="86" height="24" rx="12" fill="#FBE3E4"/>
  <text x="927" y="322" font-size="11.5" font-weight="600" fill="#C42B32" text-anchor="middle">Overdue</text>

  <!-- Table -->
  <g filter="url(#shadow)">
    <rect x="264" y="364" width="992" height="240" rx="16" fill="#FFFFFF"/>
  </g>
  <rect x="264" y="364" width="992" height="44" rx="16" fill="#F8EFEC"/>
  <rect x="264" y="392" width="992" height="16" fill="#F8EFEC"/>
  <text x="288" y="392" font-size="12" font-weight="700" fill="#7B2233">EMPLOYEE</text>
  <text x="560" y="392" font-size="12" font-weight="700" fill="#7B2233">DEPARTMENT</text>
  <text x="800" y="392" font-size="12" font-weight="700" fill="#7B2233">STATUS</text>
  <text x="1010" y="392" font-size="12" font-weight="700" fill="#7B2233">NET PAY</text>

  <!-- rows -->
  <g font-size="13" fill="#3D2E30">
    <text x="288" y="442">Suraj Kumar  <tspan fill="#A8989A" font-size="11">· SK0001</tspan></text>
    <text x="560" y="442">Retail Operations</text>
    <rect x="800" y="430" width="62" height="20" rx="10" fill="#E7F2EB"/><text x="831" y="444" font-size="11" fill="#2E7D52" text-anchor="middle">Paid</text>
    <text x="1010" y="442" font-weight="600">₹1,72,300</text>
    <rect x="264" y="460" width="992" height="1" fill="#F0E6E4"/>

    <text x="288" y="494">Priya Nair  <tspan fill="#A8989A" font-size="11">· PN0044</tspan></text>
    <text x="560" y="494">Finance</text>
    <rect x="800" y="482" width="74" height="20" rx="10" fill="#FBF1DB"/><text x="837" y="496" font-size="11" fill="#A9740C" text-anchor="middle">Pending</text>
    <text x="1010" y="494" font-weight="600">₹1,98,000</text>
    <rect x="264" y="512" width="992" height="1" fill="#F0E6E4"/>

    <text x="288" y="546">Arjun Rao  <tspan fill="#A8989A" font-size="11">· AR0210</tspan></text>
    <text x="560" y="546">Engineering</text>
    <rect x="800" y="534" width="62" height="20" rx="10" fill="#E7F2EB"/><text x="831" y="548" font-size="11" fill="#2E7D52" text-anchor="middle">Paid</text>
    <text x="1010" y="546" font-weight="600">₹2,41,500</text>
  </g>

  <!-- ───────── Palette strip ───────── -->
  <text x="264" y="650" font-size="13" font-weight="700" fill="#241619">Palette · Metallic Maroon + Champagne</text>
  <g font-size="10.5" fill="#6E5F61" text-anchor="middle">
    <rect x="264" y="664" width="120" height="58" rx="10" fill="url(#maroon)"/><text x="324" y="744" fill="#241619">Primary #7B2233</text>
    <rect x="396" y="664" width="120" height="58" rx="10" fill="#8A2A3B"/><text x="456" y="744" fill="#241619">Hover #8A2A3B</text>
    <rect x="528" y="664" width="120" height="58" rx="10" fill="url(#champagne)"/><text x="588" y="744" fill="#241619">Accent #C8A05A</text>
    <rect x="660" y="664" width="120" height="58" rx="10" fill="#FAF6F4" stroke="#E3D7D5"/><text x="720" y="744" fill="#241619">Canvas #FAF6F4</text>
    <rect x="792" y="664" width="110" height="58" rx="10" fill="#2E7D52"/><text x="847" y="744" fill="#241619">Success</text>
    <rect x="914" y="664" width="110" height="58" rx="10" fill="#C2890F"/><text x="969" y="744" fill="#241619">Warning</text>
    <rect x="1036" y="664" width="110" height="58" rx="10" fill="#DC2F36"/><text x="1091" y="744" fill="#241619">Error (kept distinct)</text>
  </g>

  <text x="264" y="792" font-size="11.5" fill="#8A7B7D">Note: error red is deliberately brighter/cleaner than the maroon brand, so "destructive" never blurs with "primary".</text>
</svg>
