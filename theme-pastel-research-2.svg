<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="880" viewBox="0 0 1480 880" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="rq-btn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C98198"/><stop offset="1" stop-color="#9A5872"/></linearGradient>
    <linearGradient id="sg-btn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FA678"/><stop offset="1" stop-color="#647A50"/></linearGradient>
    <linearGradient id="pw-btn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8B97D9"/><stop offset="1" stop-color="#5E6BAE"/></linearGradient>
    <linearGradient id="mt-btn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FBFA2"/><stop offset="1" stop-color="#4A937A"/></linearGradient>
    <linearGradient id="ws-btn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#AC80C1"/><stop offset="1" stop-color="#7E5694"/></linearGradient>
    <linearGradient id="bc-btn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D88E92"/><stop offset="1" stop-color="#A55F68"/></linearGradient>
