  <rect width="1480" height="880" fill="#FBFAFC"/>
  <text x="40" y="48" font-size="28" font-weight="700" fill="#1A1A22">Feminine / pastel — more directions (batch 3)</text>
  <text x="40" y="76" font-size="14" fill="#6B6B78">Fresh moods: a Pantone pairing, two botanical greens, periwinkle, wisteria &amp; warm buttercream · same architecture, deepened primaries for legible buttons</text>

  <!-- Row 1 -->
  <!-- RQ -->
  <g transform="translate(40,100)">
    <rect width="440" height="350" rx="16" fill="#FFFFFF" stroke="#FBEAEF" stroke-width="1.5"/>
    <rect width="440" height="44" rx="16" fill="url(#rq-btn)"/><rect y="28" width="440" height="16" fill="url(#rq-btn)"/>
    <circle cx="28" cy="22" r="11" fill="#FFF"/><text x="23" y="26" font-size="12" font-weight="800" fill="#9A5872">C</text>
    <text x="46" y="26" font-size="12.5" font-weight="700" fill="#FFF">Cognix</text><text x="98" y="26" font-size="12.5" font-weight="700" fill="#F7CAC9">HR</text>
    <text x="20" y="78" font-size="19" font-weight="700" fill="#3A1F2C">Rose Quartz &amp; Serenity</text>
    <text x="20" y="98" font-size="12" fill="#94697A">Pantone classic · rose + periwinkle blue</text>
    <rect x="20" y="110" width="110" height="50" rx="9" fill="#B5708A"/><text x="30" y="140" font-size="11.5" font-weight="700" fill="#FFF">#B5708A</text><text x="30" y="154" font-size="9" fill="#F2D6DF">primary</text>
    <rect x="140" y="110" width="110" height="50" rx="9" fill="url(#rq-btn)"/><text x="150" y="140" font-size="11" font-weight="700" fill="#FFF">gradient</text>
    <rect x="260" y="110" width="80" height="50" rx="9" fill="#92A8D1"/><text x="270" y="140" font-size="10.5" font-weight="700" fill="#1E2A45">serenity</text>
    <rect x="350" y="110" width="70" height="50" rx="9" fill="#F7CAC9"/><text x="358" y="140" font-size="10" font-weight="700" fill="#6E2A38">rose qtz</text>
    <rect x="20" y="176" width="120" height="36" rx="9" fill="url(#rq-btn)"/><text x="42" y="199" font-size="12" font-weight="600" fill="#FFF">Run Payroll</text>
    <rect x="150" y="176" width="86" height="36" rx="9" fill="#FFF" stroke="#FBEAEF"/><text x="170" y="199" font-size="12" font-weight="600" fill="#B5708A">Export</text>
    <rect x="246" y="176" width="78" height="36" rx="18" fill="#92A8D1"/><text x="262" y="199" font-size="11" fill="#1E2A45">Serenity</text>
