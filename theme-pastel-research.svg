  <rect width="1480" height="860" fill="#FBFAFC"/>
  <text x="40" y="50" font-size="28" font-weight="700" fill="#1A1A22">Pastel Dreamland — soft &amp; airy feminine directions</text>
  <text x="40" y="80" font-size="15" font-weight="600" fill="#6B6B78">Based on the Coolors pastel set: lilac #CDB4DB · pink #FFC8DD · rose #FFAFCC · baby-blue #BDE0FE · sky #A2D2FF</text>
  <text x="40" y="100" font-size="13" fill="#9A9AA8">Note: pastel themes use a soft tinted top bar with dark text (airier than the dark-bar themes). Buttons use a deepened pastel so white text stays readable.</text>

  <!-- ===== A: PASTEL DREAMLAND ===== -->
