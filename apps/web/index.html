<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/cognixhr-favicon.png" />
    <link rel="apple-touch-icon" href="/brand/cognixhr-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1A4D8F" />
    <meta name="description" content="CognixHR — Smarter Workforce. Stronger Future. A Saar HRMS application." />
    <title>CognixHR — Smarter Workforce. Stronger Future.</title>
    <!-- Inter — primary typeface for enterprise design system -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  <!-- Immediately apply theme before React hydrates — prevents dark flash -->
  <script>
    (function(){
      var t = localStorage.getItem('aurora-theme');
      var root = document.documentElement;
      root.classList.remove('dark');
      root.dataset.theme = (t === 'petrol' || t === 'bordeaux' || t === 'slate') ? t : '';
      root.style.colorScheme = 'light';
    })();
  </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
