<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" fill="none">
  <defs>
    <linearGradient id="ring" x1="50" y1="158" x2="155" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#112494"/>
      <stop offset="42%"  stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="mono" x1="100" y1="152" x2="100" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0B6B5A"/>
      <stop offset="55%"  stop-color="#0EA5A0"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="hr-grad" x1="0" y1="1" x2="0" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>

  <!-- ── Icon mark ── -->
  <path d="M 149.5 50.5 A 70 70 0 1 0 149.5 149.5"
        stroke="url(#ring)" stroke-width="21" stroke-linecap="round"/>
  <circle cx="86" cy="68" r="9" fill="url(#mono)"/>
  <rect x="78.5" y="81" width="15" height="68" rx="7.5" fill="url(#mono)"/>
  <rect x="104" y="65" width="15" height="84" rx="7.5" fill="url(#mono)"/>
  <rect x="78.5" y="113" width="40.5" height="13" rx="6.5" fill="url(#mono)"/>

  <!-- ── Wordmark (white "Cognix" + bright teal "HR") ── -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&amp;display=swap');
    .wm { font-family: 'Poppins', 'Inter', system-ui, sans-serif; font-weight: 700; }
  </style>

  <text class="wm" x="220" y="122" font-size="88" fill="#FFFFFF" letter-spacing="-1">Cognix</text>
  <text class="wm" x="545" y="122" font-size="88" fill="url(#hr-grad)" letter-spacing="-1">HR</text>

  <line x1="220" y1="142" x2="265" y2="142" stroke="#60A5FA" stroke-width="1.5" stroke-linecap="round"/>
  <text x="272" y="147" font-family="'Poppins','Inter',system-ui,sans-serif" font-size="13"
        fill="rgba(255,255,255,0.55)" letter-spacing="3.5" font-weight="500">SMARTER WORKFORCE. STRONGER FUTURE.</text>
  <line x1="652" y1="142" x2="672" y2="142" stroke="#2DD4BF" stroke-width="1.5" stroke-linecap="round"/>

  <text x="220" y="168" font-family="'Poppins','Inter',system-ui,sans-serif" font-size="11"
        fill="#60A5FA" letter-spacing="5" font-weight="500">SAAR HRMS APPLICATION</text>
</svg>
