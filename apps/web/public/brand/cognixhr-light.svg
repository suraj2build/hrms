<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" fill="none">
  <!-- Single-colour navy monochrome variant for light/white backgrounds -->
  <defs>
    <linearGradient id="ring" x1="50" y1="158" x2="155" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#112494"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- ── Icon mark (navy, no teal fill) ── -->
  <path d="M 149.5 50.5 A 70 70 0 1 0 149.5 149.5"
        stroke="url(#ring)" stroke-width="21" stroke-linecap="round"/>
  <circle cx="86" cy="68" r="9" fill="#1E40AF"/>
  <rect x="78.5" y="81" width="15" height="68" rx="7.5" fill="#1E40AF"/>
  <rect x="104" y="65" width="15" height="84" rx="7.5" fill="#1E40AF"/>
  <rect x="78.5" y="113" width="40.5" height="13" rx="6.5" fill="#1E40AF"/>

  <!-- ── Wordmark (all navy) ── -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&amp;display=swap');
    .wm { font-family: 'Poppins', 'Inter', system-ui, sans-serif; font-weight: 700; }
  </style>

  <text class="wm" x="220" y="122" font-size="88" fill="#0F172A" letter-spacing="-1">CognixHR</text>

  <line x1="220" y1="142" x2="265" y2="142" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round"/>
  <text x="272" y="147" font-family="'Poppins','Inter',system-ui,sans-serif" font-size="13"
        fill="#64748B" letter-spacing="3.5" font-weight="500">SMARTER WORKFORCE. STRONGER FUTURE.</text>
  <line x1="652" y1="142" x2="672" y2="142" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round"/>

  <text x="220" y="168" font-family="'Poppins','Inter',system-ui,sans-serif" font-size="11"
        fill="#2563EB" letter-spacing="5" font-weight="500">SAAR HRMS APPLICATION</text>
</svg>
