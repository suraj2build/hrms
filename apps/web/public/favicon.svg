  <!-- Head dot -->
  <circle cx="20.6" cy="16.3" r="2.2" fill="url(#f)"/>
  <!-- Left pillar -->
  <rect x="18.8" y="19.4" width="3.6" height="16.3" rx="1.8" fill="url(#f)"/>
  <!-- Right pillar -->
  <rect x="25.0" y="15.6" width="3.6" height="20.2" rx="1.8" fill="url(#f)"/>
  <!-- Crossbar -->
