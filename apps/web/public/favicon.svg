<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="r" x1="12" y1="38" x2="37" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#112494"/>
      <stop offset="42%"  stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="f" x1="24" y1="37" x2="24" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0B6B5A"/>
      <stop offset="55%"  stop-color="#0EA5A0"/>
      <stop offset="100%" stop-color="#22D3EE"/>
